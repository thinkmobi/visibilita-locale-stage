<style>
/* Deck dell'analisi dedicata: slide 16:9 in cqw, stessa resa nell'app, su telefono e nel PDF (motore/analisi.py).
   I dati arrivano da L.datiAnalisi (logica.js): window.disegna({data, testi, filtro, pdf}). */
:root{--pg:#E9EBE8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pg)}
body{padding:12px;font-family:'Roboto',system-ui,sans-serif}
.deck{display:grid;gap:18px;max-width:1180px;margin:0 auto}
.cap{font:500 11px/1 'Roboto Mono',ui-monospace,monospace;color:#5F6773;margin:0 0 6px;letter-spacing:.04em}
.vuoto{font:15px/1.4 'Roboto',system-ui,sans-serif;color:#5F6773;padding:40px 16px;text-align:center}

/* palette: legenda delle mappe (verde = primi posti, giallo/arancio = metà, rosso = in fondo o assente) */
.skin-a{
  --bg:#F4F5F3; --ink:#18232A; --muted:#5F6B70; --line:#D2D7D3; --panel:#FFFFFF;
  --accent:#1E8E3E; --accent-ink:#FFFFFF; --home:#1A73E8;
  --r1:#1E8E3E; --r2:#34A853; --r3:#6CC24A; --r4:#F6C026; --r5:#F29529; --r6:#E8603C; --r7:#C5221F;
  --r1-ink:#FFFFFF; --r2-ink:#FFFFFF; --r3-ink:#18232A; --r4-ink:#18232A; --r5-ink:#18232A; --r6-ink:#FFFFFF; --r7-ink:#FFFFFF;
  --contour:#D9DDD9;
  --f-display:'Roboto Condensed','Arial Narrow',sans-serif; --f-body:'Roboto',system-ui,sans-serif; --f-mono:'Roboto Mono',ui-monospace,monospace;
  --fs-title:3.8cqw; --fs-sub:2.3cqw; --fs-body:1.75cqw; --fs-label:1.1cqw;
}
.slide{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:var(--fs-body);line-height:1.4;overflow:hidden;border-radius:.5cqw;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sl{position:absolute;inset:0;font-size:var(--fs-body);padding:4cqw 5cqw 3cqw;display:grid;grid-template-rows:auto 1fr auto;gap:1.8cqw}
.sl.withleg{grid-template-rows:auto 1fr auto auto}
.eyebrow{font:700 var(--fs-label)/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:1.2cqw;align-items:center}
.eyebrow i{display:inline-block;width:1.6cqw;height:.18cqw;background:var(--accent)}
.eyebrow .pf{display:inline-flex;align-items:center;gap:.6cqw;color:var(--ink)}
.eyebrow .pf svg{width:1.5cqw;height:1.5cqw}
.title{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:var(--fs-title);line-height:1.06;margin:.9cqw 0 0;text-wrap:balance;max-width:80cqw}
.foot{display:flex;justify-content:space-between;gap:2cqw;font:400 var(--fs-label)/1 var(--f-mono);color:var(--muted);border-top:.08cqw solid var(--line);padding-top:.9cqw}
.foot span:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legrow{display:flex;justify-content:flex-end}
.body{min-height:0;display:grid;gap:3cqw;align-items:center}
.big{font-family:var(--f-display);font-weight:700;font-size:9.5cqw;line-height:.85;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.unit{font-size:.45em;letter-spacing:0}
.lab{font:700 var(--fs-label)/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lab.plain{font-weight:400;text-transform:none;letter-spacing:0}
.txt{font-size:var(--fs-body);line-height:1.4;max-width:46cqw}
.kv{display:flex;gap:3cqw;flex-wrap:wrap}
.kv div{display:grid;gap:.4cqw}
.kv b{font-family:var(--f-display);font-weight:700;font-size:2.99cqw;line-height:1;font-variant-numeric:tabular-nums}
.mapbox{position:relative;aspect-ratio:1;justify-self:end}
.lfmap{position:relative;margin:0;aspect-ratio:1;justify-self:end;border-radius:.5cqw;overflow:hidden;background:var(--panel);border:.08cqw solid var(--line)}
.lfmap .vec{position:absolute;inset:0;padding:.6cqw}
.lfmap figcaption{position:absolute;left:.6cqw;bottom:.6cqw;font:500 var(--fs-label) var(--f-mono);background:var(--panel);color:var(--muted);padding:.25cqw .5cqw;border-radius:.3cqw}
.grid{display:block;width:100%;height:100%}
.svgt{font-family:var(--f-mono)}
.legend{display:flex;gap:1.2cqw;flex-wrap:nowrap;white-space:nowrap;font:400 var(--fs-label) var(--f-mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.5cqw}
.legend s{width:.9cqw;height:.9cqw;border-radius:50%;display:inline-block}
.panel{background:var(--panel);border-radius:.6cqw;padding:2cqw}
.neg,.eff{border-radius:.4cqw;background:#FCE4E2;border-left:.35cqw solid var(--r7);color:#5C1410}
.neg{padding:1cqw 1.3cqw}
.eff{margin-top:auto;padding:.7cqw 1cqw;font-size:var(--fs-body);font-weight:600}
.flagrv{display:grid;grid-template-columns:3cqw 1fr;gap:1.2cqw;align-items:center;background:#FCE4E2;border-left:.4cqw solid var(--r7);border-radius:.4cqw;padding:1cqw 1.4cqw;color:#5C1410}
.flagrv b{font-family:var(--f-display);font-size:2.1cqw;line-height:1.1}
.flagrv svg{width:3cqw;height:3cqw}

/* copertina e chiusura */
.cover .sl{grid-template-rows:auto 1fr auto auto}
.cover.first .sl{grid-template-rows:auto 1fr auto}
/* copertina e chiusura: stesso motivo a pallini, stessa misura e posizione (il modello è la copertina) */
.cover-bg{position:absolute;right:-6cqw;top:calc(50% - 26cqw);width:52cqw;height:52cqw}
.cover .foot{max-width:46cqw}   /* la chiusura tiene il piede a sinistra, fuori dal motivo */
.cover-name{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:6.57cqw;line-height:.95;margin:0;max-width:44cqw;text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.contact{display:grid;gap:.8cqw;max-width:50cqw;position:relative;background:var(--panel);border-radius:.6cqw;padding:1.4cqw 1.8cqw;border-left:.4cqw solid var(--accent);justify-self:start}
.contact .cname{font-family:var(--f-display);font-weight:700;font-size:var(--fs-sub);line-height:1.1;display:block}
.contact .cline{display:flex;align-items:center;gap:1cqw;font-family:var(--f-display);font-weight:600;font-size:2cqw;line-height:1.1;font-variant-numeric:tabular-nums}
.contact .cline svg{width:2cqw;height:2cqw;flex:none}

/* guida alla lettura */
.howto{display:grid;gap:.9cqw}
.hrow{display:grid;grid-template-columns:3.2cqw 1fr;gap:1.2cqw;align-items:center}
.hpin{width:3.2cqw;height:3.2cqw}
.hrow b{font-family:var(--f-display);font-weight:700;font-size:var(--fs-body)}

/* classifica: merchant evidenziato in blu */
.cmp{display:grid;gap:.7cqw;width:100%}
.cmp-h,.cmp-r{display:grid;grid-template-columns:2.4cqw 30cqw 1fr 6cqw;gap:1cqw;align-items:center}
.cmp-h{font:700 var(--fs-label) var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:.4cqw;border-bottom:.08cqw solid var(--line)}
.cmp-h span:first-child{grid-column:1 / 3}.cmp-h span:last-child{grid-column:3 / 5}
.cmp-r .n{font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{display:block;height:1.8cqw;background:#E6E9E6;border-radius:.3cqw;overflow:hidden}
.fill{display:block;height:100%;background:#9AA4A8;border-radius:inherit}
.fill.me{background:var(--home)}
.pill{display:inline-grid;place-items:center;width:2.2cqw;height:2.2cqw;border-radius:50%;font:600 var(--fs-label) var(--f-mono);justify-self:end}
.pill.rk{background:var(--panel);border:.12cqw solid var(--line);color:var(--ink)}.pill.rk.me{background:var(--home);border-color:var(--home);color:#fff}
.top3sep{grid-column:1/-1;display:flex;align-items:center;gap:1cqw;font:700 var(--fs-label) var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.top3sep::after{content:"";flex:1;border-top:.12cqw solid var(--line)}
.youtag{display:inline-block;margin-left:.6cqw;padding:.1cqw .5cqw;border-radius:.3cqw;background:var(--home);color:#fff;font:700 .9cqw var(--f-mono);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.cmp-r.me{background:rgba(26,115,232,.09);box-shadow:inset .35cqw 0 0 var(--home);border-radius:.4cqw;margin:0 -.6cqw;padding:.35cqw .6cqw}
.cmp-r.me .n{font-weight:600}
.val{font:400 var(--fs-label) var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.val b{font-weight:600;color:var(--ink);font-size:var(--fs-body)}
.duel{display:grid;gap:1cqw}
.gap{font-size:var(--fs-body);border-top:.08cqw solid var(--line);padding-top:1cqw}

/* AI Mode contro Maps: due mappe affiancate, anello e numeri sotto */
.twin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4cqw;align-items:start}
.tcol{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:2cqw;row-gap:1cqw;align-items:center}
.tcol .ph{grid-column:1/-1}
.tcol .ph{display:flex;align-items:center;gap:.7cqw;font-family:var(--f-display);font-weight:700;font-size:2cqw}
.tcol .ph svg{width:2cqw;height:2cqw}
.tstat{display:grid;gap:1cqw;align-content:center}
.tstat .ring{width:8cqw;height:8cqw}
.tstat b{display:block;font-family:var(--f-display);font-weight:700;font-size:2.4cqw;line-height:1}
.ring{flex:none}

/* punti deboli */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;width:100%;align-self:stretch}
.card{display:grid;grid-template-rows:auto auto auto 1fr;align-content:start;gap:.7cqw;padding:1.3cqw 1.5cqw}
.card .ico{width:3.2cqw;height:3.2cqw}
.card h3,.step h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--fs-sub);line-height:1.1}
.card.alert{border:.2cqw solid var(--r7)}

/* piano */
.tl{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;width:100%}
.tl::before{content:"";position:absolute;left:2cqw;right:2cqw;top:2cqw;height:.18cqw;background:var(--line)}
.step{position:relative;display:grid;gap:1.2cqw;align-content:start}
.dot{width:4cqw;height:4cqw;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 1.61cqw var(--f-mono)}
.when{font:500 var(--fs-label) var(--f-mono);color:var(--muted)}

/* stampa: una slide per pagina 1600×900 */
body.pdf{padding:0;background:#fff}
body.pdf .deck{gap:0;max-width:none}
body.pdf .cap{display:none}
body.pdf .slide{width:1600px;border-radius:0;box-shadow:none;break-after:page}
@media print{@page{size:1600px 900px;margin:0}}
</style>

<body>
<main class="deck" id="deck"><div class="vuoto">Caricamento dell'analisi…</div></main>
<script>
/* ================= MOTORE DEL DECK =================
   Unico deck per ogni cliente e settore: i numeri arrivano dai dati della zona, i testi si scrivono da soli
   e si possono correggere a mano (A.testi, chiave → testo). Prima il blocco Google AI Mode, poi Google Maps. */
(function () {
  const up = (n) => { n = Math.max(0, Number(n) || 0); const f = Math.floor(n + 1e-9); return n - f > .5 + 1e-9 ? f + 1 : f; };   // X,5 per difetto
  const it = (n) => up(n).toLocaleString('it-IT');
  const pc = (a, b) => (b ? it(a / b * 100) : '0') + '%';
  const heat = (r) => !r || r >= 20 ? 'r7' : r === 1 ? 'r1' : r === 2 ? 'r2' : r === 3 ? 'r3' : r <= 6 ? 'r4' : r <= 10 ? 'r5' : 'r6';
  const top3 = (g) => g.flat().filter((r) => r && r <= 3).length;
  const ord = (n, g = 'f') => it(n) + (g === 'm' ? 'º' : 'ª');   // ª con posizione, º con posto
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* colori dello schema per le quote tra le prime 3 posizioni (come L.colorePct): verde dal 66%, arancione dal 33%, rosso sotto */
  const tinta = (v) => (v >= 66 ? 'var(--r1)' : v >= 33 ? 'var(--r5)' : 'var(--r7)');
  const tintaPct = (h) => String(h).replace(/(\d+(?:,\d+)?)\s?%/g, (m, n) => `<span style="color:${tinta(parseFloat(n.replace(',', '.')))}">${m}</span>`);
  const elenco = (a) => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
  const zone = (n) => n === 1 ? '1 zona' : n + ' zone';
  const ICO = {
    ai: (c) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="${c}"/></svg>`,
    maps: (c) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-7-7.2-7-12.4A7 7 0 0 1 19 9.6C19 14.8 12 22 12 22z" fill="${c}"/><circle cx="12" cy="9.6" r="2.8" fill="#fff"/></svg>`,
  };

  function contours(cx, cy, max, step, k) {
    let s = '';
    for (let r = step, i = 0; r <= max; r += step, i++) {
      let d = '';
      for (let j = 0; j <= 56; j++) { const a = j / 56 * Math.PI * 2, rr = r * (1 + 0.07 * Math.sin(3 * a + k + i * .6) + 0.045 * Math.sin(5 * a - (k + i * .6) * 1.7)); d += (j ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); }
      s += `<path d="${d}Z" fill="none" stroke="var(--contour)" stroke-width="${i % 3 === 2 ? .55 : .3}"/>`;
    }
    return s;
  }

  window.disegna = function (A) {
    const D = A.data, OV = A.testi || {}, B = D.business, G = D.grid, N = G.points, KW = D.kw;
    const MG = D.mapGrid || { first: .203, step: (1 - 2 * .203) / Math.max(1, G.size - 1) };
    let gid = 0;
    /* griglia delle posizioni; bgmap: la mappa reale solo nelle slide con i dati veri */
    function gridSVG(rows, { hl = null, labels = true, dim = false, deco = true, neutral = false, dims = null, aria = '', bgmap = null } = {}) {
      const n = rows.length, s = 10, w = n * s, c = w / 2, m = Math.floor(n / 2) * s + s / 2, pd = dims ? 13 : 3, R = bgmap ? 3 : 4.1, fs = bgmap ? 3.3 : 4, hr = bgmap ? 4.6 : 5.8, id = 'mc' + (++gid);
      let out = `<svg class="grid" viewBox="${-pd} -3 ${w + pd + 3} ${w + pd + 3}" role="img" aria-label="${esc(aria)}">`;
      if (bgmap) { const k = s / MG.step, ix = s / 2 - MG.first * k;
        out += `<defs><clipPath id="${id}"><rect x="-3" y="-3" width="${w + 6}" height="${w + 6}"/></clipPath></defs><image href="${bgmap}" x="${ix.toFixed(2)}" y="${ix.toFixed(2)}" width="${k.toFixed(2)}" height="${k.toFixed(2)}" preserveAspectRatio="none" clip-path="url(#${id})"/>`; }
      else if (deco) out += contours(c, c, w * 0.78, w * 0.065, 1.3);
      rows.forEach((row, y) => row.forEach((r, x) => {
        const cx = x * s + s / 2, cy = y * s + s / 2, cls = heat(r), off = dim && hl && !hl(y, x), op = off && !bgmap ? .22 : 1;
        const fill = neutral ? 'var(--line)' : off && bgmap ? '#E4E7E4' : `var(--${cls})`, ink = off && bgmap ? '#9AA19A' : `var(--${cls}-ink)`;
        out += `<g opacity="${op}"><circle cx="${cx}" cy="${cy}" r="${R}"${bgmap ? ' stroke="#fff" stroke-width=".5"' : ''} fill="${fill}"/>`;
        if (labels && r) out += `<text x="${cx}" y="${cy + fs * .36}" text-anchor="middle" font-size="${fs}" font-weight="${bgmap ? 600 : 400}" class="svgt" fill="${ink}">${r > 20 ? '20+' : r}</text>`;
        out += '</g>';
      }));

    const ring = (gr) => { const f = gr.flat(), n = f.length || 1, C = 2 * Math.PI * 48, S = [[f.filter((r) => r && r <= 3).length, 'r2'], [f.filter((r) => r > 3 && r <= 10).length, 'r4'], [f.filter((r) => !r || r > 10).length, 'r7']]; let o = 0, arcs = '';

      ...(AI && MP ? [{ g: 'chiusura', cap: 'Google AI Mode contro Google Maps', legend: true, f: (n) => frame(n, 'Google AI Mode contro Google Maps', H('aiTitle'),
        `<div class="body" style="grid-template-rows:auto auto;gap:1.6cqw;align-content:center">
          <div class="twin">${[AI, MP].map((f) => `<div class="tcol"><div class="ph">${ICO[f.k]('var(--ink)')}${f.lab}</div>${mapFig(f.grid, 'Mappa ' + f.lab, 21, D.mapImg)}
            <div class="tstat">${ring(f.grid)}<div><span class="lab">tra le prime 3 posizioni</span><b>${f.t3} su ${f.pts}</b></div></div></div>`).join('')}</div>
          ${T.aiTxt ? `<div class="txt" style="max-width:none">${H('aiTxt')}</div>` : ''}
        </div>`) }] : []),
      ...(cardMeta.length ? [{ g: 'chiusura', cap: 'Cosa frena la scheda', f: (n) => { const ico = (k) => `<svg class="ico" viewBox="0 0 40 40" aria-hidden="true">${[
          '<circle cx="20" cy="20" r="15" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M5 20h30M20 5c6 6 6 24 0 30M20 5c-6 6-6 24 0 30" fill="none" stroke="var(--accent)" stroke-width="2"/>',
          '<path d="M20 4l13 6v9c0 9-6 15-13 17C13 34 7 28 7 19v-9z" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M14 20l4 4 8-9" fill="none" stroke="var(--accent)" stroke-width="3"/>',
          '<path d="M20 36s-11-11-11-19a11 11 0 0 1 22 0c0 8-11 19-11 19z" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="20" cy="17" r="4" fill="none" stroke="var(--accent)" stroke-width="3"/>'][k]}</svg>`;
        return frame(n, 'Diagnosi della scheda Google', H('cardsTitle'),
          `<div class="body"><div class="cards" style="grid-template-columns:repeat(${cardMeta.length},1fr)">${cardMeta.map((c, i) => `<div class="panel card${c.alert ? ' alert' : ''}">${ico(c.ico)}<h3>${H(`card${i + 1}t`)}</h3><div>${H(`card${i + 1}c`)}</div><div class="eff">${H(`card${i + 1}e`)}</div></div>`).join('')}</div></div>`); } }] : []),
      { g: 'chiusura', cap: 'Chiusura', f: (n) => cover(false, `<div class="eyebrow"><i></i>Prossimo passo</div>
        <div style="display:grid;gap:1.6cqw;align-content:center"><h2 class="cover-name" style="font-size:5.29cqw">${H('ctaTitle')}</h2><div class="txt">${H('ctaSub')}</div></div>
        <div class="contact"><div><b class="cname">${esc(SIGN[0])}</b></div>
          <div class="cline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="var(--accent)"/></svg>${esc(SIGN[1])}</div>
          <div class="cline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3z" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M3 6l9 7 9-7" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>${esc(SIGN[2])}</div></div>
        ${footHTML(n)}`) },
      { g: 'interne', internal: true, cap: 'Il piano · interna, esclusa dal PDF', f: (n) => frame(n, 'Piano di lavoro', H('planTitle'),
        `<div class="body"><div class="tl">${[1, 2, 3].map((i) => `<div class="step"><div class="dot">${i}</div><span class="when">${['settimane 1–4', 'mesi 1–2', 'mesi 2–3'][i - 1]}</span><h3>${H('step' + i)}</h3><div>${H('step' + i + 'txt')}</div></div>`).join('')}</div>
          <div class="lab plain">${H('planNote')}</div></div>`) },
    ];
    const filtro = A.filtro || 'tutte';
    SHOWN = SLIDES.filter((s) => (A.pdf ? !s.internal : true));
    const vis = SHOWN.map((s, i) => [s, i]).filter(([s]) => filtro === 'tutte' || s.g === filtro);
    document.body.classList.toggle('pdf', !!A.pdf);
    document.getElementById('deck').innerHTML = vis.map(([s, i]) => { CUR = s; return `<section><p class="cap">${String(i + 1).padStart(2, '0')} · ${s.cap}</p><div class="skin-a">${s.f(i + 1)}</div></section>`; }).join('') || '<div class="vuoto">Nessuna slide in questo gruppo.</div>';
    return { base, slide: SHOWN.length };
  };
  /* PDF dal motore: i dati arrivano già nella pagina */
  if (window.ANALISI) window.disegna(window.ANALISI);
})();
</script>
</body>
</html>

# Genera il PDF dell'analisi dedicata quando l'app salva zone/<id>/analisi/<chiave>-richiesta.json
name: Genera analisi
on:
  push:
    paths: ["zone/*/analisi/*-richiesta.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dati-analisi
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motore/requirements-analisi.txt
      - run: pip install -r motore/requirements-analisi.txt
      - run: python -m playwright install --with-deps chromium
      - name: Genera le analisi richieste
        run: bash motore/esegui_analisi.sh
      - name: Salva nel repository
        run: bash motore/salva.sh "PDF analisi dedicata" "bash motore/esegui_analisi.sh"
